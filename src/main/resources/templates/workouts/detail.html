<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/workouts}">Training log</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${workout.name}">Session</li>
                </ol>
            </nav>

            <div class="card-pulse p-4 p-md-5">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                    <div>
                        <div class="d-flex gap-2 mb-2">
                            <span class="badge" th:classappend="'text-bg-' + ${workout.type.colour}"
                                  th:text="${workout.type.label}">Cardio</span>
                            <span class="badge" th:classappend="'text-bg-' + ${workout.difficulty.colour}"
                                  th:text="${workout.difficulty.label}">Beginner</span>
                        </div>
                        <h1 class="h3 fw-bold mb-1" th:text="${workout.name}">Session</h1>
                        <div class="text-muted small">
                            Logged by <strong th:text="${workout.ownerName}">Member</strong>
                            on <span th:text="${#temporals.format(workout.dateLogged, 'EEEE d MMMM yyyy')}">date</span>
                        </div>
                    </div>

                    <div class="d-flex gap-2" th:if="${canModify}">
                        <a class="btn btn-outline-pulse btn-sm" th:href="@{/workouts/{id}/edit(id=${workout.id})}">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/workouts/{id}(id=${workout.id})}" method="post"
                              data-confirm="Delete this session? This cannot be undone.">
                            <input type="hidden" name="_method" value="delete">
                            <button class="btn btn-outline-danger btn-sm" type="submit">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${workout.durationMinutes}">45</div>
                            <div class="stat-label">Minutes</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${workout.caloriesBurned != null} ? ${workout.caloriesBurned} : '—'">300</div>
                            <div class="stat-label">Calories</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${workout.trainingLoad}">52</div>
                            <div class="stat-label">Training load</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${workout.difficulty.intensityFactor}">1.0</div>
                            <div class="stat-label">Intensity factor</div>
                        </div>
                    </div>
                </div>

                <div th:if="${workout.notes}">
                    <h2 class="h6 fw-bold">Notes</h2>
                    <p class="text-muted" th:text="${workout.notes}">Notes</p>
                </div>

                <hr>
                <dl class="row small mb-0 text-muted">
                    <dt class="col-sm-3">Record id</dt>
                    <dd class="col-sm-9" th:text="${workout.id}">1</dd>
                    <dt class="col-sm-3">Created</dt>
                    <dd class="col-sm-9" th:text="${workout.createdAt != null} ? ${#temporals.format(workout.createdAt, 'd MMM yyyy, HH:mm')} : '—'">-</dd>
                    <dt class="col-sm-3">Last updated</dt>
                    <dd class="col-sm-9" th:text="${workout.updatedAt != null} ? ${#temporals.format(workout.updatedAt, 'd MMM yyyy, HH:mm')} : '—'">-</dd>
                </dl>
            </div>

            <div class="mt-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/workouts}">
                    <i class="bi bi-arrow-left me-1"></i>Back to the log
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
