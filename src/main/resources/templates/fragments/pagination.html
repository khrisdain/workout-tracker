<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Server side pager. `page` is the Spring Data Page, `filter` carries the
  current query so every link keeps the active filters and sort.
-->
<nav th:fragment="pager(page, filter, baseUrl)" th:if="${page.totalPages > 1}" aria-label="Page navigation">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=0)} + ${filter.toQueryString()}" aria-label="First">
                <i class="bi bi-chevron-double-left"></i>
            </a>
        </li>
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1})} + ${filter.toQueryString()}">Prev</a>
        </li>

        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:if="${i >= page.number - 2 and i <= page.number + 2}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${baseUrl}(page=${i})} + ${filter.toQueryString()}" th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1})} + ${filter.toQueryString()}">Next</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.totalPages - 1})} + ${filter.toQueryString()}" aria-label="Last">
                <i class="bi bi-chevron-double-right"></i>
            </a>
        </li>
    </ul>
</nav>

<!-- Sortable column header. -->
<th th:fragment="sortHeader(field, label, filter, baseUrl)">
    <a th:href="@{${baseUrl}(page=0)} + ${filter.toSortLink(field)}">
        <span th:text="${label}">Column</span>
        <i class="bi"
           th:classappend="${filter.safeSort == field} ? (${filter.ascending} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up opacity-25'"></i>
    </a>
</th>

</body>
</html>
