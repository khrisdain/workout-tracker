<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-6">
            <div class="display-1 fw-bold" style="color: var(--pt-accent)">404</div>
            <h1 class="h3 fw-bold mt-2 mb-3">That page is not in the log</h1>
            <p class="text-muted" th:text="${detail} ?: 'The link may be stale, or the record was deleted.'">The link may be stale, or the record was deleted.</p>
            <div class="d-flex justify-content-center gap-2 mt-4">
                <a class="btn btn-pulse" th:href="@{/}">Back to the home page</a>
                <a class="btn btn-outline-secondary" th:href="@{/workouts}">Open the training log</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
