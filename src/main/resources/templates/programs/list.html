<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <div>
            <span class="section-label">Programs</span>
            <h1 class="h3 fw-bold mb-0 mt-1">Structured blocks written by the coaching team</h1>
            <p class="text-muted small mb-0">Enrol in as many as you like. They show up on your dashboard.</p>
        </div>
        <a sec:authorize="hasAnyRole('COACH','ADMIN')" class="btn btn-pulse btn-sm" th:href="@{/programs/new}">
            <i class="bi bi-plus-lg me-1"></i>New program
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="program : ${programs}">
            <div class="card-pulse h-100 p-4 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge" th:classappend="'text-bg-' + ${program.focus.colour}"
                          th:text="${program.focus.label}">Cardio</span>
                    <span class="badge" th:classappend="'text-bg-' + ${program.difficulty.colour}"
                          th:text="${program.difficulty.label}">Beginner</span>
                </div>

                <h2 class="h5 fw-bold">
                    <a class="text-decoration-none text-reset" th:href="@{/programs/{id}(id=${program.id})}"
                       th:text="${program.name}">Program</a>
                </h2>
                <p class="small text-muted flex-grow-1"
                   th:text="${#strings.abbreviate(program.description, 150)}">Description</p>

                <div class="d-flex flex-wrap gap-3 small text-muted border-top pt-3">
                    <span><i class="bi bi-calendar3 me-1"></i><span th:text="|${program.durationWeeks} weeks|">9</span></span>
                    <span><i class="bi bi-repeat me-1"></i><span th:text="|${program.sessionsPerWeek}x per week|">3x</span></span>
                    <span><i class="bi bi-people me-1"></i><span th:text="${#lists.size(program.members)}">0</span></span>
                </div>
                <div class="small text-muted mt-2">
                    <i class="bi bi-person-badge me-1"></i><span th:text="${program.coachName}">Coach</span>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(programs)}">
            <div class="empty-state p-5 text-center">
                <i class="bi bi-diagram-3 fs-1 text-muted"></i>
                <h2 class="h5 fw-bold mt-3">No published programs</h2>
                <p class="text-muted mb-0">A coach has not published anything yet.</p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
