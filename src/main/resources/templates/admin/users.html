<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin console</a></li>
            <li class="breadcrumb-item active" aria-current="page">Users</li>
        </ol>
    </nav>

    <h1 class="h3 fw-bold mb-1">Manage accounts</h1>
    <p class="text-muted small mb-4">
        Change roles, suspend an account, or delete it. The last remaining administrator is protected from
        every one of those actions.
    </p>

    <div class="card-pulse p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-pulse align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Member</th>
                    <th>Contact</th>
                    <th style="min-width:260px">Roles</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span class="avatar-chip" th:text="${user.initials}">JR</span>
                            <div>
                                <div class="fw-semibold" th:text="${user.fullName}">Name</div>
                                <code class="small" th:text="${user.username}">user</code>
                            </div>
                        </div>
                    </td>
                    <td class="small text-muted">
                        <div th:text="${user.email}">email</div>
                        <div th:text="${user.createdAt != null} ? 'Joined ' + ${#temporals.format(user.createdAt, 'd MMM yyyy')} : ''"></div>
                    </td>
                    <td>
                        <form th:action="@{/admin/users/{id}/roles(id=${user.id})}" method="post"
                              class="d-flex flex-wrap align-items-center gap-2">
                            <div class="form-check form-check-inline m-0" th:each="role : ${allRoles}">
                                <input class="form-check-input" type="checkbox" name="roles"
                                       th:id="|role-${user.id}-${role}|" th:value="${role}"
                                       th:checked="${user.roles.contains(role)}">
                                <label class="form-check-label small" th:for="|role-${user.id}-${role}|"
                                       th:text="${role.label}">Role</label>
                            </div>
                            <button class="btn btn-sm btn-outline-pulse" type="submit">Save</button>
                        </form>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${user.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${user.enabled} ? 'Active' : 'Suspended'">Active</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1">
                            <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post">
                                <input type="hidden" name="enabled" th:value="${!user.enabled}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit"
                                        th:title="${user.enabled} ? 'Suspend this account' : 'Reactivate this account'">
                                    <i class="bi" th:classappend="${user.enabled} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post"
                                  th:attr="data-confirm='Delete ' + ${user.username} + ' permanently?'">
                                <input type="hidden" name="_method" value="delete">
                                <button class="btn btn-sm btn-outline-danger" type="submit" title="Delete account">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
