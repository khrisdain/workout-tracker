# =====================================================================
# PulseTrack - local infrastructure
#
#   docker compose up -d              start every database
#   docker compose up -d mysql        only the primary app's prod database
#   docker compose up -d postgres     only the microservice's qa database
#   docker compose ps                 check health
#   docker compose down               stop, keeping the data volumes
#   docker compose down -v            stop and wipe the data
#
# Nothing in this file is required for the default dev profile: both
# applications run on in-memory H2 with no containers at all.
# =====================================================================
name: pulsetrack

services:

  # ---- MySQL: the `prod` profile of the primary PulseTrack application ----
  mysql:
    image: mysql:8.4
    container_name: pulsetrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pulsetrack}
      MYSQL_USER: ${MYSQL_USER:-pulsetrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- PostgreSQL: the `qa` profile of the nutrition microservice ----
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutritiondb}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrition-pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrition} -d ${POSTGRES_DB:-nutritiondb}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---- Adminer: browse either database at http://localhost:8082 ----
  adminer:
    image: adminer:4
    container_name: pulsetrack-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - mysql
      - postgres

volumes:
  mysql-data:
  postgres-data:
