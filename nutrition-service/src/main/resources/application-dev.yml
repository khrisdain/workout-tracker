# =====================================================================
# Nutrition Service - DEV profile
# H2 in memory, recreated and re-seeded on every start.
# Console: http://localhost:8081/h2-console  (JDBC url below, user sa)
# =====================================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:nutritiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      platform: h2                # -> data-h2.sql

logging:
  level:
    com.pulsetrack.nutrition: DEBUG
    org.hibernate.SQL: DEBUG
