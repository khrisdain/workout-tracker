<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/programs}">Programs</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${program.name}">Program</li>
                </ol>
            </nav>

            <div class="card-pulse p-4 p-md-5">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                    <div>
                        <div class="d-flex gap-2 mb-2">
                            <span class="badge" th:classappend="'text-bg-' + ${program.focus.colour}"
                                  th:text="${program.focus.label}">Cardio</span>
                            <span class="badge" th:classappend="'text-bg-' + ${program.difficulty.colour}"
                                  th:text="${program.difficulty.label}">Beginner</span>
                            <span class="badge text-bg-secondary" th:unless="${program.published}">Draft</span>
                        </div>
                        <h1 class="h3 fw-bold mb-1" th:text="${program.name}">Program</h1>
                        <div class="text-muted small">
                            Written by <strong th:text="${program.coachName}">Coach</strong>
                        </div>
                    </div>

                    <div class="d-flex gap-2" th:if="${canModify}">
                        <a class="btn btn-outline-pulse btn-sm" th:href="@{/programs/{id}/edit(id=${program.id})}">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/programs/{id}(id=${program.id})}" method="post"
                              data-confirm="Delete this program and all its enrolments?">
                            <input type="hidden" name="_method" value="delete">
                            <button class="btn btn-outline-danger btn-sm" type="submit">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>

                <p th:text="${program.description}">Description</p>

                <div class="row g-3 my-4">
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${program.durationWeeks}">9</div>
                            <div class="stat-label">Weeks</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${program.sessionsPerWeek}">3</div>
                            <div class="stat-label">Per week</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${program.totalSessions}">27</div>
                            <div class="stat-label">Total sessions</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-tile text-center">
                            <div class="stat-value" th:text="${#lists.size(program.members)}">0</div>
                            <div class="stat-label">Enrolled</div>
                        </div>
                    </div>
                </div>

                <div sec:authorize="isAuthenticated()" class="border-top pt-4">
                    <form th:unless="${enrolled}" th:action="@{/programs/{id}/enroll(id=${program.id})}" method="post">
                        <button class="btn btn-pulse px-4" type="submit">
                            <i class="bi bi-plus-circle me-1"></i>Enrol in this program
                        </button>
                    </form>
                    <div th:if="${enrolled}" class="d-flex flex-wrap align-items-center gap-3">
                        <span class="badge text-bg-success py-2 px-3">
                            <i class="bi bi-check-circle me-1"></i>You are enrolled
                        </span>
                        <form th:action="@{/programs/{id}/withdraw(id=${program.id})}" method="post">
                            <button class="btn btn-outline-secondary btn-sm" type="submit">Leave program</button>
                        </form>
                    </div>
                </div>

                <div sec:authorize="!isAuthenticated()" class="border-top pt-4">
                    <a class="btn btn-outline-pulse" th:href="@{/login}">Sign in to enrol</a>
                </div>
            </div>

            <div class="card-pulse p-4 mt-4" sec:authorize="hasAnyRole('COACH','ADMIN')">
                <h2 class="h6 fw-bold mb-3">Enrolled members</h2>
                <div class="d-flex flex-wrap gap-2">
                    <span class="badge text-bg-light border py-2 px-3" th:each="member : ${program.members}"
                          th:text="${member.fullName}">Member</span>
                    <span class="text-muted small" th:if="${#lists.isEmpty(program.members)}">Nobody has enrolled yet.</span>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
