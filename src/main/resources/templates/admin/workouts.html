<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin console</a></li>
            <li class="breadcrumb-item active" aria-current="page">Workouts</li>
        </ol>
    </nav>

    <h1 class="h3 fw-bold mb-1">Every logged session</h1>
    <p class="text-muted small mb-4">
        <span th:text="${page.totalElements}">0</span> records. Administrators can edit or delete any of them,
        whoever logged it.
    </p>

    <form class="filter-bar p-3 mb-4" method="get" th:action="@{/admin/workouts}" data-reset-page>
        <input type="hidden" name="page" value="0">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-semibold" for="q">Search</label>
                <input class="form-control form-control-sm" id="q" name="q" type="search" th:value="${filter.q}">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold" for="type">Type</label>
                <select class="form-select form-select-sm" id="type" name="type">
                    <option value="">All</option>
                    <option th:each="t : ${workoutTypes}" th:value="${t}" th:text="${t.label}"
                            th:selected="${filter.type != null and filter.type.name() == t.name()}">Cardio</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold" for="difficulty">Difficulty</label>
                <select class="form-select form-select-sm" id="difficulty" name="difficulty">
                    <option value="">All</option>
                    <option th:each="d : ${difficultyLevels}" th:value="${d}" th:text="${d.label}"
                            th:selected="${filter.difficulty != null and filter.difficulty.name() == d.name()}">Beginner</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-pulse btn-sm" type="submit">Filter</button>
            </div>
        </div>
    </form>

    <div class="card-pulse p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-pulse table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th th:replace="~{fragments/pagination :: sortHeader('name', 'Session', ${filter}, '/admin/workouts')}"></th>
                    <th>Member</th>
                    <th>Type</th>
                    <th class="text-end" th:replace="~{fragments/pagination :: sortHeader('durationMinutes', 'Duration', ${filter}, '/admin/workouts')}"></th>
                    <th class="text-end" th:replace="~{fragments/pagination :: sortHeader('dateLogged', 'Date', ${filter}, '/admin/workouts')}"></th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="workout : ${page.content}">
                    <td class="text-muted small" th:text="${workout.id}">1</td>
                    <td>
                        <a class="fw-semibold text-decoration-none text-reset"
                           th:href="@{/workouts/{id}(id=${workout.id})}" th:text="${workout.name}">Session</a>
                    </td>
                    <td class="small text-muted" th:text="${workout.ownerName}">Member</td>
                    <td>
                        <span class="badge" th:classappend="'text-bg-' + ${workout.type.colour}"
                              th:text="${workout.type.label}">Cardio</span>
                    </td>
                    <td class="text-end" th:text="|${workout.durationMinutes} min|">45 min</td>
                    <td class="text-end small text-muted"
                        th:text="${#temporals.format(workout.dateLogged, 'd MMM yyyy')}">1 Jan</td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/workouts/{id}/edit(id=${workout.id})}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/workouts/{id}(id=${workout.id})}" method="post"
                                  data-confirm="Delete this session permanently?">
                                <input type="hidden" name="_method" value="delete">
                                <button class="btn btn-sm btn-outline-danger" type="submit">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${page.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">Nothing matches those filters.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center p-3 border-top bg-light"
             th:if="${page.totalPages > 1}">
            <span class="small text-muted">
                Page <strong th:text="${page.number + 1}">1</strong> of <strong th:text="${page.totalPages}">3</strong>
            </span>
            <div th:replace="~{fragments/pagination :: pager(${page}, ${filter}, '/admin/workouts')}"></div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
